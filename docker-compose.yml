version: "3.3"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: campus_flow_api_development
      POSTGRES_USER: campus_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - campus_flow_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    command: bash -lc "bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://campus_flow:${POSTGRES_PASSWORD}@db:5432/campus_flow_api_development
      RAILS_MAX_THREADS: 2
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  campus_flow_postgres_data:
